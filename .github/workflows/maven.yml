name: Maven CI

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
      - name: Start app
        run: |
          nohup java -jar artifacts/app-ibank-build-for-testers.jar > app.log 2>&1 &
          echo "Waiting for app to start..."
          for i in {1..30}; do
            if curl -s http://localhost:9999 > /dev/null; then
              echo "App is ready!"
              sleep 10
              break
            fi
            echo "Still waiting... ($i)"
            sleep 2
          done
          echo "App log (last 20 lines):"
          tail -20 app.log
      - name: Run tests
        run: mvn test
      - name: Print page source on failure
        if: failure()
        run: |
          echo "Printing page source from test reports..."
          find build/reports/tests -name "*.html" -exec cat {} \;